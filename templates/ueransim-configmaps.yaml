apiVersion: v1
kind: ConfigMap
metadata:
  name: gnb-config
data:
  gnb.yaml: |
    mcc: '999'
    mnc: '70'
    nci: '0x000000010'
    idLength: 32
    tac: 1

    linkIp: 192.168.122.224
    ngapIp: 192.168.122.224
    gtpIp: 192.168.122.224

    amfConfigs:
      - address: open5gs-amf-ngap.open5gs.svc.cluster.local
        port: 38412

    slices:
      - sst: 1

    ignoreStreamIds: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ue1-config
data:
  ue.yaml: |
    supi: "imsi-999700000000001"
    mcc: "999"
    mnc: "70"

    key: "465B5CE8B199B49FAA5F0A2EE238A6BC"
    op: "E8ED289DEBA952E4283B54E88E6183CA"
    opType: "OPC"
    amf: "8000"

    imei: "356938035643803"
    imeiSv: "4370816125816151"

    gnbSearchList:
      - "192.168.122.224"

    sessions:
      - type: "IPv4"
        apn: "internet"
        slice:
          sst: 1

    configured-nssai:
      - sst: 1

    integrity:
      IA1: true
      IA2: true
      IA3: true

    ciphering:
      EA1: true
      EA2: true
      EA3: true

    integrityMaxRate:
      uplink: full
      downlink: full

    uacAic:
      mps: false
      mcs: false

    uacAcc:
      normalClass: 0
      class11: false
      class12: false
      class13: false
      class14: false
      class15: false
---
