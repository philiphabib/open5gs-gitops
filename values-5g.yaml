dbURI: "mongodb://{{ .Release.Name }}-mongodb/open5gs"

populate:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs-dbctl
    tag: 0.10.3
    pullPolicy: IfNotPresent
  initCommands: []
  # example of initCommands:
  #  - open5gs-dbctl add 999700000000001 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA
  #  - open5gs-dbctl add_ue_with_apn 999700000000002 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA internet
  #  - open5gs-dbctl add_ue_with_slice 999700000000003 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA internet 1 111111

# Common
mongodb:
  enabled: true
  auth:
    enabled: false
  persistence:
    storageClass: nfs-storage-retain
smf:
  enabled: true
  config:
    pcrf:
      enabled: false

    upf:
      pfcp:
        upfs:
          - address: open5gs-upf-pfcp
            dnn: internet
          - address: open5gs-ims-upf-pfcp
            dnn: ims

    subnetList:
      - subnet: 10.45.0.0/16
        gateway: 10.45.0.1
        dnn: internet

      - subnet: 10.46.0.0/16
        gateway: 10.46.0.1
        dnn: ims
upf:
  enabled: true
  config:
    subnetList:
      - subnet: 10.45.0.0/16
        gateway: 10.45.0.1
        dnn: internet
        dev: ogstun
        mask: 16
        createDev: true
        enableNAT: true
ims-upf:
  enabled: true
  config:
    subnetList:
      - subnet: 10.46.0.0/16
        gateway: 10.46.0.1
        dnn: ims
        dev: ogstun
        mask: 16
        createDev: true
        enableNAT: false

webui:
  enabled: true
  services:
    http:
      type: NodePort
      nodePorts:
        http: "30999"

  ingress:
    enabled: false
    hostname: open5gs.local

# 4G
hss:
  enabled: false
mme:
  enabled: false
pcrf:
  enabled: false
sgwc:
  enabled: false
sgwu:
  enabled: false

# 5G
amf:
  enabled: true
  config:
    plmnList:
      - plmn_id:
          mcc: "999"
          mnc: "70"
        s_nssai:
          - sst: 1
            sd: "0x111111"
          - sst: 2
            sd: "0x222222"
          - sst: 3
            sd: "0x333333"
ausf:
  enabled: true
bsf:
  enabled: true
nrf:
  enabled: true
nssf:
  enabled: true
pcf:
  enabled: true
  mongodb:
    enabled: false
scp:
  enabled: true
  mongodb:
    enabled: false
sepp:
  enabled: false
  config:
  logLevel: info
  n32:
    server:
      sender: ""
    client:
      sepp:
        receiver: ""
        uri: ""
udm:
  enabled: true
udr:
  enabled: true
