# ============================================================
# Open5GS GitOps
# Gradiant Open5GS Helm Chart 2.2.0
# Phase 1 - 5G SA baseline
# ============================================================

open5gs:

  # ----------------------------------------------------------
  # Database
  # ----------------------------------------------------------

  dbURI: "mongodb://{{ .Release.Name }}-mongodb/open5gs"

  # ----------------------------------------------------------
  # MongoDB
  # ----------------------------------------------------------

  mongodb:
    enabled: true

    auth:
      enabled: false
    image:
      repository: bitnamilegacy/mongodb
      tag: 4.4.1
      pullPolicy: IfNotPresent

    persistence:
      storageClass: nfs-storage-retain
    volumePermissions:
      enabled: false

  # ----------------------------------------------------------
  # 5G Core
  # ----------------------------------------------------------

  amf:
    enabled: true

  ausf:
    enabled: true

  bsf:
    enabled: true

  nrf:
    enabled: true

  nssf:
    enabled: true

  pcf:
    enabled: true
    mongodb:
      enabled: false

  scp:
    enabled: true
    mongodb:
      enabled: false

  smf:
    enabled: true

  udm:
    enabled: true

  udr:
    enabled: true
    mongodb:
      enabled: false

  upf:
    enabled: true

  # ----------------------------------------------------------
  # 4G EPC - disabled for initial 5G SA deployment
  # ----------------------------------------------------------

  hss:
    enabled: false

  mme:
    enabled: false

  pcrf:
    enabled: false

  sgwc:
    enabled: false

  sgwu:
    enabled: false

  # ----------------------------------------------------------
  # Optional
  # ----------------------------------------------------------

  sepp:
    enabled: false

  webui:
    enabled: false

  # ----------------------------------------------------------
  # Database population
  #
  # Disabled for now.
  # Subscriber configuration will be added later.
  # ----------------------------------------------------------

  populate:
    enabled: false
